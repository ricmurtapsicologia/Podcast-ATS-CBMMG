name: Python media audit

on:
  pull_request:
    paths:
      - 'scripts/audio_pipeline.py'
      - '.github/workflows/python-media-audit.yml'
  workflow_dispatch:
    inputs:
      full_media_audit:
        description: 'Run full read-only inventory of audio files'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Compile pipeline
        run: python -m py_compile scripts/audio_pipeline.py

  full-audit:
    if: github.event_name == 'workflow_dispatch' && inputs.full_media_audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Ensure ffprobe is available
        run: |
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
      - name: Build read-only media inventory
        run: python scripts/audio_pipeline.py audit --root . --output artifacts/audio-inventory.json
      - name: Upload inventory
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: podcast-audio-inventory
          path: artifacts/audio-inventory.json
          if-no-files-found: ignore

name: Hotfix A1-001 Prosody

on:
  push:
    branches: [main]
    paths:
      - 'scripts/hotfix_a1_001_prosody.py'
      - 'roteiros/serie-1/a1-001.txt'
      - '.github/workflows/hotfix-a1-001-prosody.yml'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: podcast-a1-001-prosody
  cancel-in-progress: true

jobs:
  render:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install edge-tts pydub
      - name: Renderizar A1-001 com prosodia humanizada
        run: python scripts/hotfix_a1_001_prosody.py
      - name: Validar integridade, ritmo e master
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path

          version='n3-a1-001-prosody-20260902a'
          report=json.loads(Path('assets/audio/serie-1/quality-n3.json').read_text(encoding='utf-8'))
          ep=next(e for e in report['episodes'] if e['episode']==1)
          assert ep['version']==version, ep
          assert ep['speaker_cast']=={'INSTRUTOR':'pt-BR-FranciscaNeural'}, ep['speaker_cast']
          assert ep['turns']>=12, ep['turns']
          assert ep['word_count']==144, ep['word_count']
          assert 110 <= float(ep['estimated_wpm']) <= 138, ep['estimated_wpm']
          assert 62 <= float(ep['duration_seconds']) <= 78, ep['duration_seconds']
          assert ep['prosody_hotfix']['semantic_segmentation'] is True
          assert ep['prosody_hotfix']['contextual_pauses'] is True

          app=Path('app.js').read_text(encoding='utf-8')
          assert f'a1-001-n3.mp3?v={version}' in app

          p=Path('assets/audio/serie-1/a1-001-n3.mp3')
          assert p.exists() and p.stat().st_size>1000
          info=json.loads(subprocess.check_output([
              'ffprobe','-v','error','-select_streams','a:0',
              '-show_entries','stream=channels,sample_rate,duration','-of','json',str(p)
          ], text=True))['streams'][0]
          assert int(info['channels'])==1
          assert int(info['sample_rate'])==44100
          assert 62 <= float(info['duration']) <= 78

          hotfix=json.loads(Path('reports/a1-001-prosody-hotfix.json').read_text(encoding='utf-8'))
          assert hotfix['lexical_integrity']==1.0
          assert hotfix['content_changed'] is False
          print('PASS: A1-001 humanizado, texto íntegro, ritmo dentro da janela e cache atualizado.')
          PY
      - name: Commitar somente audio, QA e cache do A1-001
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/audio/serie-1/a1-001-n3.mp3 assets/audio/serie-1/quality-n3.json app.js reports/a1-001-prosody-hotfix.json
          if git diff --cached --quiet; then
            echo "Sem alteracoes"
            exit 0
          fi
          git commit -m "fix(audio): humanizar prosodia do A1-001"
          git pull --rebase --autostash origin main
          git push origin HEAD:main

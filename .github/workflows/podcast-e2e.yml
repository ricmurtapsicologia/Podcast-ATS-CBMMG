name: Podcast player E2E

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app.js'
      - 'styles.css'
      - 'assets/audio/serie-1/**'
      - 'assets/audio/serie-2/**'
      - 'scripts/smoke_player_e2e.py'
      - '.github/workflows/podcast-e2e.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'app.js'
      - 'styles.css'
      - 'assets/audio/serie-1/**'
      - 'assets/audio/serie-2/**'
      - 'scripts/smoke_player_e2e.py'
      - '.github/workflows/podcast-e2e.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  player-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Instalar Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium
      - name: Servir site localmente
        run: |
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/podcast-http.log 2>&1 &
          echo $! > /tmp/podcast-http.pid
          for i in {1..20}; do curl -fsS http://127.0.0.1:8765/ >/dev/null && exit 0; sleep 0.5; done
          cat /tmp/podcast-http.log
          exit 1
      - name: Smoke E2E local do player
        run: python scripts/smoke_player_e2e.py http://127.0.0.1:8765/
      - name: Confirmar identidade da release pública N3
        run: |
          python - <<'PY'
          import os
          import time
          import urllib.request

          sha = os.environ['GITHUB_SHA']
          url = f"https://ricmurtapsicologia.github.io/Podcast-ATS-CBMMG/app.js?release={sha}"
          version = 'n3-cast-20260901c'
          last = None
          for attempt in range(1, 31):
              try:
                  with urllib.request.urlopen(url, timeout=15) as response:
                      text = response.read().decode('utf-8')
                  s1 = text.count('assets/audio/serie-1/a1-')
                  s2 = text.count('assets/audio/serie-2/a2-')
                  version_refs = text.count(f'?v={version}')
                  if s1 == 21 and s2 == 14 and version_refs == 35 and 'n3-cast-20260901b' not in text:
                      print(f'PASS: app público {version}; Série 1 21/21; Série 2 14/14; URLs 35/35.')
                      break
                  last = f's1={s1} s2={s2} refs={version_refs}'
              except Exception as exc:
                  last = f'{type(exc).__name__}: {exc}'
              if attempt == 30:
                  raise RuntimeError(f'GitHub Pages não convergiu para a release esperada: {last}')
              time.sleep(5)
          PY
      - name: Smoke E2E da versão pública
        run: python scripts/smoke_player_e2e.py https://ricmurtapsicologia.github.io/Podcast-ATS-CBMMG/

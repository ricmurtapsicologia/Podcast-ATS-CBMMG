name: Girando a Ampulheta — Experience Gate

on:
  push:
    branches: [main, refactor/learning-experience-v4]
    paths:
      - 'index.html'
      - 'app.js'
      - 'content-manifest.js'
      - 'psp.js'
      - 'psp-cards.json'
      - 'styles.css'
      - 'psp.css'
      - 'learning-v4.css'
      - 'assets-v4.css'
      - 'assets/img/**'
      - 'assets/audio/serie-1/**'
      - 'assets/audio/serie-2/**'
      - 'assets/audio/serie-3/**'
      - 'scripts/smoke_player_e2e.py'
      - 'scripts/validate_learning_v4.py'
      - '.github/workflows/podcast-e2e.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'app.js'
      - 'content-manifest.js'
      - 'psp.js'
      - 'psp-cards.json'
      - 'styles.css'
      - 'psp.css'
      - 'learning-v4.css'
      - 'assets-v4.css'
      - 'assets/img/**'
      - 'assets/audio/serie-1/**'
      - 'assets/audio/serie-2/**'
      - 'assets/audio/serie-3/**'
      - 'scripts/smoke_player_e2e.py'
      - 'scripts/validate_learning_v4.py'
      - '.github/workflows/podcast-e2e.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  experience-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Gate estrutural
        run: python scripts/validate_learning_v4.py
      - name: Instalar Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium
      - name: Servir site localmente
        run: |
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/podcast-http.log 2>&1 &
          echo $! > /tmp/podcast-http.pid
          for i in {1..30}; do curl -fsS http://127.0.0.1:8765/ >/dev/null && exit 0; sleep 0.5; done
          cat /tmp/podcast-http.log
          exit 1
      - name: E2E desktop, mobile, progresso, PSP e acessibilidade
        run: python scripts/smoke_player_e2e.py http://127.0.0.1:8765/
      - name: Smoke público após merge em main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          python - <<'PY'
          import time
          import urllib.request

          url = 'https://ricmurtapsicologia.github.io/Podcast-ATS-CBMMG/'
          marker = 'gav-learning-v4-20260902'
          last = None
          for attempt in range(1, 31):
              try:
                  with urllib.request.urlopen(url, timeout=15) as response:
                      text = response.read().decode('utf-8')
                  if marker in text and 'content-manifest.js' in text and 'learning-v4.css' in text:
                      print('PASS: GitHub Pages convergiu para GAV learning v4.')
                      break
                  last = 'marker ausente'
              except Exception as exc:
                  last = f'{type(exc).__name__}: {exc}'
              if attempt == 30:
                  raise RuntimeError(f'GitHub Pages não convergiu: {last}')
              time.sleep(5)
          PY
      - name: E2E da versão pública
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python scripts/smoke_player_e2e.py https://ricmurtapsicologia.github.io/Podcast-ATS-CBMMG/

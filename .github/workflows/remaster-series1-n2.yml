name: Remasterizar Série 1 — padrão N2 Série 3

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/remaster-series1-n2.yml'
      - 'scripts/remaster_series1_n2.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remaster:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1
          python -m pip install --upgrade pip
          pip install 'faster-whisper>=1.1,<2' edge-tts==7.2.8 pydub 'librosa>=0.10,<1' 'scikit-learn>=1.5,<2'

      - name: Remasterizar Série 1
        run: python scripts/remaster_series1_n2.py

      - name: Publicar Série 1 N2 na branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/audio/serie-1 roteiros/serie-1 app.js index.html
          if git diff --cached --quiet; then
            echo "Sem alterações geradas."
          else
            git commit -m "Gera Série 1 no padrão N2 da Série 3"
            git push origin HEAD:${{ github.head_ref || github.ref_name }}
          fi

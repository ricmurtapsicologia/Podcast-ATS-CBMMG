name: Gerar PSP N3 Natural

on:
  push:
    branches: [main]
    paths:
      - 'scripts/n3_audio_core.py'
      - 'scripts/generate_psp_audio_n3.py'
      - 'roteiros/serie-3/**'
      - '.github/workflows/generate-psp-audio-n3.yml'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: podcast-psp-n3
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install edge-tts pydub
      - name: Gerar audios
        run: python scripts/generate_psp_audio_n3.py
      - name: Smoke test
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          q=json.loads(Path('assets/audio/serie-3/quality-psp-n3.json').read_text(encoding='utf-8'))
          assert len(q['cards'])==10
          for row in q['cards']:
              p=Path('assets/audio/serie-3')/row['output']; assert p.exists() and p.stat().st_size>1000
              info=json.loads(subprocess.check_output(['ffprobe','-v','error','-select_streams','a:0','-show_entries','stream=channels,sample_rate,duration','-of','json',str(p)],text=True))['streams'][0]
              assert int(info['channels'])==1 and int(info['sample_rate'])==44100 and float(info['duration'])>0
          js=Path('psp.js').read_text(encoding='utf-8')
          assert '-n3.mp3' in js and '10 microaulas N3' in js
          print('PASS: PSP 10/10 N3-C.')
          PY
      - name: Commitar masters
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/audio/serie-3 psp.js
          if git diff --cached --quiet; then echo "Sem alteracoes"; exit 0; fi
          git commit -m "build: publicar microaulas PSP N3"
          git pull --rebase --autostash origin main
          git push origin HEAD:main

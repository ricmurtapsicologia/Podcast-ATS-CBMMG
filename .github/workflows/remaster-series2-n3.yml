name: Remasterizar Serie 2 N3 Natural

on:
  push:
    branches: [main]
    paths:
      - 'scripts/n3_audio_core.py'
      - 'scripts/n3_foley.py'
      - 'scripts/remaster_series2_n3.py'
      - 'sound-design/series-2.json'
      - 'roteiros/serie-2/**'
      - '.github/workflows/remaster-series2-n3.yml'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: podcast-serie2-n3
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install edge-tts pydub numpy
      - name: Gerar Serie 2 N3
        run: python scripts/remaster_series2_n3.py
      - name: Smoke test tecnico N3
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          report=json.loads(Path('assets/audio/serie-2/quality-n3.json').read_text(encoding='utf-8'))
          eps=report['episodes']
          assert len(eps)==14
          assert [e['episode'] for e in eps]==list(range(14))
          for e in eps:
              p=Path('assets/audio/serie-2')/e['output']
              assert p.exists() and p.stat().st_size>1000, p
              out=subprocess.check_output(['ffprobe','-v','error','-select_streams','a:0','-show_entries','stream=channels,sample_rate,duration','-of','json',str(p)],text=True)
              info=json.loads(out)['streams'][0]
              assert int(info['sample_rate'])==44100, (p,info)
              assert float(info['duration'])>0, (p,info)
              expected_channels=2 if e['profile']=='N3-D' else 1
              assert int(info['channels'])==expected_channels, (p,info)
              assert e['text_integrity_spoken_content']==1.0
          app=Path('app.js').read_text(encoding='utf-8')
          assert app.count('-n3.mp3')>=14
          assert 'speechSynthesis' not in app
          print('PASS: 14/14 episodios N3, 44.1 kHz, canais corretos, runtime N3.')
          PY
      - name: Commitar masters N3
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/audio/serie-2 app.js
          if git diff --cached --quiet; then
            echo "Sem alteracoes"
            exit 0
          fi
          git commit -m "build: publicar Serie 2 no padrao N3 Natural"
          git pull --rebase --autostash origin main
          git push origin HEAD:main

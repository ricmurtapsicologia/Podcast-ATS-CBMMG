name: N3 release gate

on:
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'scripts/n3_audio_core.py'
      - 'scripts/n3_casting.py'
      - 'scripts/remaster_series1_n3.py'
      - 'scripts/remaster_series2_n3.py'
      - 'scripts/qa_n3_release.py'
      - 'assets/audio/serie-1/**'
      - 'assets/audio/serie-2/**'
      - '.github/workflows/n3-release-gate.yml'
  pull_request:
    paths:
      - 'app.js'
      - 'scripts/n3_audio_core.py'
      - 'scripts/n3_casting.py'
      - 'scripts/remaster_series1_n3.py'
      - 'scripts/remaster_series2_n3.py'
      - 'scripts/qa_n3_release.py'
      - 'assets/audio/serie-1/**'
      - 'assets/audio/serie-2/**'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Compilar núcleo N3
        run: python -m py_compile scripts/n3_audio_core.py scripts/n3_casting.py scripts/qa_n3_release.py
      - name: Gate integral 35/35
        run: python scripts/qa_n3_release.py
